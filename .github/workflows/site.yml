# Live ingest every 3 hours + tests + deploy the website to GitHub Pages.
# Written with the help of an AI coding assistant (Claude Code by Anthropic).
name: live-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pyyaml pytest
      - name: Unit tests
        run: PYTHONPATH=pipeline python -m pytest -q
      - name: Live ingest from NASA FIRMS (keeps last good data on failure)
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          PYTHONPATH: pipeline
        run: python -m jamra.live --regions Global
      - name: Commit live data
        run: |
          git config user.name "jamra-bot"
          git config user.email "jamra-bot@users.noreply.github.com"
          git add web/public/data/live data/live
          git commit -m "Live data update $(date -u +%Y-%m-%dT%H:%MZ)" || echo "No changes"
          git push || echo "Push failed (will retry next run)"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
