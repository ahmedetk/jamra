[project]
name = "jamra"
version = "1.0.0"
description = "Jamra: harmonized MODIS + VIIRS burning activity calendar with live NASA FIRMS early warning (Team Astro Byte, NASA Space Apps 2026). Code written with the help of an AI coding assistant (Claude Code by Anthropic)."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Team Astro Byte" }]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "pyyaml>=6",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
slides = ["python-pptx>=1.0", "qrcode>=7.4", "pillow>=10"]

[tool.setuptools]
package-dir = { "" = "pipeline" }

[tool.setuptools.packages.find]
where = ["pipeline"]
include = ["jamra*"]

[tool.pytest.ini_options]
testpaths = ["pipeline/tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
